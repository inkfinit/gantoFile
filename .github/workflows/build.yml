name: Build GantoFile

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            artifact_name: GantoFile-macos-arm64-portable
            build_cmd: pnpm tauri build --bundles app
            zip_path: release-portable/GantoFile-macos-arm64.zip
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: GantoFile-windows-x64-portable
            build_cmd: pnpm tauri build --no-bundle
            zip_path: release-portable/GantoFile-windows-x64-portable.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Python sidecar dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r sidecar-python/requirements.txt

      - name: Build Python sidecar binary
        run: python sidecar-python/build_sidecar.py --target ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri portable app
        run: ${{ matrix.build_cmd }}

      - name: Package macOS portable app
        if: runner.os == 'macOS'
        run: |
          mkdir -p release-portable
          ditto -c -k --sequesterRsrc --keepParent src-tauri/target/release/bundle/macos/GantoFile.app release-portable/GantoFile-macos-arm64.zip

      - name: Package Windows portable folder
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-portable/GantoFile | Out-Null
          Copy-Item src-tauri/target/release/ganto.exe release-portable/GantoFile/GantoFile.exe
          Copy-Item src-tauri/binaries/ganto-engine-x86_64-pc-windows-msvc.exe release-portable/GantoFile/ganto-engine.exe
          Compress-Archive -Path release-portable/GantoFile -DestinationPath release-portable/GantoFile-windows-x64-portable.zip -Force

      - name: Upload portable archive
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.zip_path }}
          if-no-files-found: error

      - name: Publish draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: ${{ matrix.zip_path }}
