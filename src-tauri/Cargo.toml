[package]
name = "ganto"
version = "0.1.0"
description = "Offline high-precision PDF-to-DOCX document converter with local OCR"
authors = ["Rianda Syahputra, S.P."]
edition = "2021"

[lib]
name = "ganto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
